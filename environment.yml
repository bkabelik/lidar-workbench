name: lidar-workbench
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - ninja
  - sparsehash
  - h5py
  - pyyaml
  - tensorboard
  - tensorboardx
  - wandb
  - yapf
  - addict
  - einops
  - scipy>=1.10
  - plyfile
  - termcolor
  - ftfy
  - regex
  - tqdm
  - matplotlib
  - black
  - open3d>=0.18
  - shapely>=2.0
  - pytest
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu128
    - --find-links https://data.pyg.org/whl/torch-2.7.0+cu128.html
    - torch==2.7.0+cu128
    - torchvision==0.22.0+cu128
    - torchaudio==2.7.0+cu128
    - torch_scatter
    - torch_cluster
    - torch_sparse
    - torch_geometric
    - spconv-cu124
    - timm
    - peft
    - git+https://github.com/octree-nn/ocnn-pytorch.git
    - git+https://github.com/openai/CLIP.git
    - PySide6>=6.5
    - numpy>=1.24
    - laspy[lazrs]>=2.5
    - rasterio>=1.3
    - scikit-learn>=1.3
    - pyproj>=3.5
    - pyqtgraph>=0.13
variables:
  CUDA_HOME: /usr/local/cuda
  TORCH_CUDA_ARCH_LIST: "8.0;8.6;8.9;9.0;12.0+PTX"
